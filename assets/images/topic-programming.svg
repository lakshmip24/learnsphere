<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="500" height="320">
  <defs>
    <linearGradient id="progBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="codeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
  </defs>
  <rect width="500" height="320" rx="16" fill="url(#progBg)"/>

  <!-- IDE Window Frame -->
  <g transform="translate(60, 45)">
    <rect width="380" height="200" rx="12" fill="#090D16" stroke="#334155" stroke-width="2"/>
    <!-- Window Bar -->
    <path d="M0 12 Q0 0 12 0 L368 0 Q380 0 380 12 L380 28 L0 28 Z" fill="#1E293B"/>
    <circle cx="16" cy="14" r="4" fill="#EF4444"/>
    <circle cx="28" cy="14" r="4" fill="#F59E0B"/>
    <circle cx="40" cy="14" r="4" fill="#10B981"/>
    <text x="65" y="18" font-family="monospace" font-size="10" fill="#94A3B8">main_algorithm.py</text>

    <!-- Syntax Code lines -->
    <text x="24" y="55" font-family="monospace" font-size="13" fill="#F43F5E">def</text>
    <text x="56" y="55" font-family="monospace" font-size="13" fill="#60A5FA">solve_problem</text>
    <text x="160" y="55" font-family="monospace" font-size="13" fill="#E2E8F0">(dataset):</text>
    
    <text x="44" y="80" font-family="monospace" font-size="12" fill="#94A3B8"># Continuous learner loop</text>
    <text x="44" y="105" font-family="monospace" font-size="13" fill="#F59E0B">for</text>
    <text x="76" y="105" font-family="monospace" font-size="13" fill="#E2E8F0">concept</text>
    <text x="140" y="105" font-family="monospace" font-size="13" fill="#F59E0B">in</text>
    <text x="164" y="105" font-family="monospace" font-size="13" fill="#E2E8F0">dataset:</text>
    
    <text x="64" y="130" font-family="monospace" font-size="13" fill="#38BDF8">knowledge</text>
    <text x="145" y="130" font-family="monospace" font-size="13" fill="#F43F5E">+=</text>
    <text x="168" y="130" font-family="monospace" font-size="13" fill="#34D399">concept.practice()</text>

    <text x="44" y="160" font-family="monospace" font-size="13" fill="#F43F5E">return</text>
    <text x="100" y="160" font-family="monospace" font-size="13" fill="#A78BFA">knowledge.grow()</text>

    <!-- Glowing cursor -->
    <rect x="250" y="148" width="8" height="15" fill="#60A5FA" opacity="0.9"/>
  </g>

  <!-- Title Pill -->
  <g transform="translate(30, 255)">
    <rect width="180" height="34" rx="8" fill="#1E293B" stroke="#2563EB" stroke-width="1.5"/>
    <text x="16" y="22" font-family="system-ui, sans-serif" font-weight="700" font-size="12" fill="#93C5FD">PROGRAMMING &amp; PYTHON</text>
  </g>
</svg>