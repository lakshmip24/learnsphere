<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="600" height="500">
  <defs>
    <linearGradient id="heroBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="sphereGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="sphereGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="sphereGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="sphereGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1E3A8A" flood-opacity="0.12"/>
    </filter>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Ambient Glow & Shapes -->
  <circle cx="300" cy="250" r="210" fill="url(#heroBgGrad)"/>
  <circle cx="300" cy="250" r="160" fill="none" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.3"/>
  <circle cx="300" cy="250" r="230" fill="none" stroke="#6366F1" stroke-width="1" stroke-dasharray="4 8" opacity="0.2"/>

  <!-- Connecting Knowledge Constellation Lines -->
  <line x1="300" y1="230" x2="140" y2="140" stroke="#93C5FD" stroke-width="2" stroke-dasharray="4 4" opacity="0.6"/>
  <line x1="300" y1="230" x2="460" y2="130" stroke="#93C5FD" stroke-width="2" stroke-dasharray="4 4" opacity="0.6"/>
  <line x1="300" y1="230" x2="120" y2="340" stroke="#93C5FD" stroke-width="2" stroke-dasharray="4 4" opacity="0.6"/>
  <line x1="300" y1="230" x2="470" y2="350" stroke="#93C5FD" stroke-width="2" stroke-dasharray="4 4" opacity="0.6"/>
  <line x1="300" y1="230" x2="300" y2="400" stroke="#93C5FD" stroke-width="2" stroke-dasharray="4 4" opacity="0.6"/>

  <!-- Central Knowledge Sphere Platform (Laptop / Digital Hub) -->
  <g transform="translate(180, 160)" filter="url(#softShadow)">
    <!-- Base Platform -->
    <rect x="0" y="0" width="240" height="150" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <!-- Screen Header -->
    <path d="M0 18 Q0 0 18 0 L222 0 Q240 0 240 18 L240 32 L0 32 Z" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <!-- Window controls -->
    <circle cx="20" cy="16" r="4" fill="#EF4444"/>
    <circle cx="34" cy="16" r="4" fill="#F59E0B"/>
    <circle cx="48" cy="16" r="4" fill="#10B981"/>
    <rect x="75" y="10" width="90" height="12" rx="6" fill="#E2E8F0"/>

    <!-- Screen Content - Learning Code & Visuals -->
    <rect x="20" y="46" width="90" height="8" rx="4" fill="#3B82F6"/>
    <rect x="20" y="60" width="130" height="6" rx="3" fill="#E2E8F0"/>
    <rect x="20" y="72" width="105" height="6" rx="3" fill="#E2E8F0"/>
    <rect x="20" y="84" width="70" height="6" rx="3" fill="#93C5FD"/>

    <!-- Code Block Inside Window -->
    <rect x="20" y="98" width="200" height="36" rx="6" fill="#1E293B"/>
    <text x="30" y="114" font-family="monospace" font-size="9" fill="#38BDF8">def</text>
    <text x="52" y="114" font-family="monospace" font-size="9" fill="#4ADE80">empower_student():</text>
    <text x="42" y="126" font-family="monospace" font-size="9" fill="#FDE047">return "SDG 4: Quality Edu"</text>

    <!-- Mini Chart Element on Right -->
    <rect x="165" y="46" width="55" height="44" rx="6" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
    <rect x="175" y="70" width="6" height="14" rx="2" fill="#3B82F6"/>
    <rect x="185" y="60" width="6" height="24" rx="2" fill="#60A5FA"/>
    <rect x="195" y="52" width="6" height="32" rx="2" fill="#2563EB"/>
    <rect x="205" y="65" width="6" height="19" rx="2" fill="#93C5FD"/>
  </g>

  <!-- Floating Satellite Badge 1: Programming & Python (Top Left) -->
  <g transform="translate(80, 80)" filter="url(#softShadow)">
    <rect x="0" y="0" width="135" height="60" rx="14" fill="#FFFFFF" stroke="#DBEAFE" stroke-width="2"/>
    <circle cx="30" cy="30" r="18" fill="url(#sphereGrad1)"/>
    <path d="M24 30 L28 26 M24 30 L28 34 M36 30 L32 26 M36 30 L32 34" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="56" y="27" font-family="sans-serif" font-weight="bold" font-size="11" fill="#1E293B">Code &amp; Logic</text>
    <text x="56" y="42" font-family="sans-serif" font-size="10" fill="#64748B">Python Basics</text>
  </g>

  <!-- Floating Satellite Badge 2: Artificial Intelligence (Top Right) -->
  <g transform="translate(390, 70)" filter="url(#softShadow)">
    <rect x="0" y="0" width="145" height="62" rx="14" fill="#FFFFFF" stroke="#E0E7FF" stroke-width="2"/>
    <circle cx="30" cy="31" r="18" fill="url(#sphereGrad2)"/>
    <!-- AI Brain Synapse Icon -->
    <circle cx="26" cy="28" r="2.5" fill="#FFFFFF"/>
    <circle cx="35" cy="26" r="2.5" fill="#FFFFFF"/>
    <circle cx="32" cy="36" r="2.5" fill="#FFFFFF"/>
    <line x1="26" y1="28" x2="35" y2="26" stroke="#FFFFFF" stroke-width="1.5"/>
    <line x1="35" y1="26" x2="32" y2="36" stroke="#FFFFFF" stroke-width="1.5"/>
    <text x="56" y="28" font-family="sans-serif" font-weight="bold" font-size="11" fill="#1E293B">Artificial Intel</text>
    <text x="56" y="43" font-family="sans-serif" font-size="10" fill="#64748B">Machine Learning</text>
  </g>

  <!-- Floating Satellite Badge 3: Web Dev & APIs (Bottom Left) -->
  <g transform="translate(60, 290)" filter="url(#softShadow)">
    <rect x="0" y="0" width="135" height="58" rx="14" fill="#FFFFFF" stroke="#CCFBF1" stroke-width="2"/>
    <circle cx="30" cy="29" r="18" fill="url(#sphereGrad4)"/>
    <!-- Globe / Web Icon -->
    <circle cx="30" cy="29" r="8" fill="none" stroke="#FFFFFF" stroke-width="1.8"/>
    <line x1="22" y1="29" x2="38" y2="29" stroke="#FFFFFF" stroke-width="1.5"/>
    <ellipse cx="30" cy="29" rx="4" ry="8" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
    <text x="56" y="27" font-family="sans-serif" font-weight="bold" font-size="11" fill="#1E293B">Web &amp; APIs</text>
    <text x="56" y="42" font-family="sans-serif" font-size="10" fill="#64748B">Fullstack Skills</text>
  </g>

  <!-- Floating Satellite Badge 4: Cybersecurity (Bottom Right) -->
  <g transform="translate(410, 290)" filter="url(#softShadow)">
    <rect x="0" y="0" width="140" height="58" rx="14" fill="#FFFFFF" stroke="#FEF3C7" stroke-width="2"/>
    <circle cx="30" cy="29" r="18" fill="url(#sphereGrad3)"/>
    <!-- Shield Icon -->
    <path d="M30 22 L36 25 V30 C36 34 30 37 30 37 C30 37 24 34 24 30 V25 Z" fill="none" stroke="#FFFFFF" stroke-width="1.8"/>
    <text x="56" y="27" font-family="sans-serif" font-weight="bold" font-size="11" fill="#1E293B">Cyber Defense</text>
    <text x="56" y="42" font-family="sans-serif" font-size="10" fill="#64748B">CIA Triad &amp; Safety</text>
  </g>

  <!-- Floating SDG 4 Quality Education Emblem (Bottom Center) -->
  <g transform="translate(210, 370)" filter="url(#softShadow)">
    <rect x="0" y="0" width="180" height="48" rx="24" fill="#C2185B"/>
    <circle cx="24" cy="24" r="16" fill="#FFFFFF"/>
    <!-- Open Book Icon -->
    <path d="M18 26 C20 24 23 24 24 25 C25 24 28 24 30 26 V19 C28 17 25 17 24 18 C23 17 20 17 18 19 Z" fill="#C2185B"/>
    <text x="48" y="22" font-family="sans-serif" font-weight="800" font-size="11" fill="#FFFFFF">UN SDG 4 ALIGNED</text>
    <text x="48" y="36" font-family="sans-serif" font-size="10" fill="#FCE7F3">Quality Education for All</text>
  </g>

  <!-- Dynamic Sparkles & Dots -->
  <circle cx="220" cy="110" r="3" fill="#3B82F6"/>
  <circle cx="380" cy="200" r="4" fill="#F59E0B"/>
  <circle cx="170" cy="260" r="3.5" fill="#10B981"/>
  <circle cx="460" cy="220" r="3" fill="#6366F1"/>
  <polygon points="350,110 353,118 361,121 353,124 350,132 347,124 339,121 347,118" fill="#F59E0B" opacity="0.8"/>
  <polygon points="170,390 172,395 177,397 172,399 170,404 168,399 163,397 168,395" fill="#3B82F6" opacity="0.8"/>
</svg>
