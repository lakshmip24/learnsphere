<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60">
  <defs>
    <linearGradient id="logoSphere" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="accentDot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>
  <!-- Icon Mark: Interlocking Learning Sphere -->
  <g transform="translate(10, 10)">
    <circle cx="20" cy="20" r="18" fill="url(#logoSphere)"/>
    <!-- Orbital Rings representing Sphere & Exploration -->
    <ellipse cx="20" cy="20" rx="19" ry="8" fill="none" stroke="#FFFFFF" stroke-width="2" transform="rotate(-30 20 20)"/>
    <ellipse cx="20" cy="20" rx="19" ry="8" fill="none" stroke="#93C5FD" stroke-width="1.5" stroke-dasharray="3 3" transform="rotate(45 20 20)"/>
    <!-- Core Knowledge Nucleus -->
    <circle cx="20" cy="20" r="6" fill="#FFFFFF"/>
    <circle cx="31" cy="11" r="3.5" fill="url(#accentDot)"/>
  </g>
  <!-- Brand Text -->
  <text x="60" y="31" font-family="system-ui, -apple-system, 'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="22" fill="#0F172A" letter-spacing="-0.5">Learn<tspan fill="#2563EB">Sphere</tspan></text>
  <text x="61" y="46" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="9" fill="#64748B" letter-spacing="1.5">LEARN • EXPLORE • GROW</text>
</svg>