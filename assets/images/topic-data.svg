<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="500" height="320">
  <defs>
    <linearGradient id="dataBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>
  <rect width="500" height="320" rx="16" fill="url(#dataBg)"/>

  <!-- Analytics Chart & Trendline -->
  <g transform="translate(80, 50)">
    <!-- Chart Box -->
    <rect width="340" height="190" rx="10" fill="#022C22" stroke="#059669" stroke-width="1.5"/>
    
    <!-- Grid lines -->
    <line x1="40" y1="40" x2="310" y2="40" stroke="#065F46" stroke-width="1" stroke-dasharray="2 2"/>
    <line x1="40" y1="80" x2="310" y2="80" stroke="#065F46" stroke-width="1" stroke-dasharray="2 2"/>
    <line x1="40" y1="120" x2="310" y2="120" stroke="#065F46" stroke-width="1" stroke-dasharray="2 2"/>
    <line x1="40" y1="150" x2="310" y2="150" stroke="#10B981" stroke-width="1.5"/>

    <!-- Bar Chart Columns -->
    <rect x="60" y="110" width="22" height="40" rx="4" fill="#34D399" opacity="0.6"/>
    <rect x="100" y="80" width="22" height="70" rx="4" fill="#34D399" opacity="0.75"/>
    <rect x="140" y="95" width="22" height="55" rx="4" fill="#34D399" opacity="0.65"/>
    <rect x="180" y="60" width="22" height="90" rx="4" fill="#10B981"/>
    <rect x="220" y="45" width="22" height="105" rx="4" fill="#10B981"/>
    <rect x="260" y="30" width="22" height="120" rx="4" fill="#059669"/>

    <!-- Trendline Curve -->
    <path d="M70 100 Q120 70 150 85 T230 40 T270 25" fill="none" stroke="#FDE047" stroke-width="3" stroke-linecap="round"/>
    <circle cx="270" cy="25" r="5" fill="#F59E0B"/>
  </g>

  <!-- Title Pill -->
  <g transform="translate(30, 255)">
    <rect width="180" height="34" rx="8" fill="#022C22" stroke="#10B981" stroke-width="1.5"/>
    <text x="16" y="22" font-family="system-ui, sans-serif" font-weight="700" font-size="12" fill="#A7F3D0">DATA SCIENCE</text>
  </g>
</svg>