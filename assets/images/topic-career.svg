<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="500" height="320">
  <defs>
    <linearGradient id="careerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350F"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>
  <rect width="500" height="320" rx="16" fill="url(#careerBg)"/>

  <!-- Career Progression & Git Branching Roadmap -->
  <g transform="translate(80, 50)">
    <rect width="340" height="190" rx="10" fill="#291A0D" stroke="#D97706" stroke-width="1.5"/>
    
    <!-- Git Branch Path -->
    <path d="M50 140 H120 C140 140 150 70 180 70 H270" fill="none" stroke="#FBBF24" stroke-width="3"/>
    <path d="M120 140 H270" fill="none" stroke="#38BDF8" stroke-width="3"/>

    <!-- Milestone Nodes -->
    <circle cx="50" cy="140" r="10" fill="#F59E0B" stroke="#FFFFFF" stroke-width="2"/>
    <text x="35" y="165" font-family="sans-serif" font-size="9" fill="#FDE68A">Basics</text>

    <circle cx="120" cy="140" r="10" fill="#38BDF8" stroke="#FFFFFF" stroke-width="2"/>
    <text x="105" y="165" font-family="sans-serif" font-size="9" fill="#BAE6FD">Git Branch</text>

    <circle cx="180" cy="70" r="10" fill="#F59E0B" stroke="#FFFFFF" stroke-width="2"/>
    <text x="165" y="55" font-family="sans-serif" font-size="9" fill="#FDE68A">Portfolio</text>

    <circle cx="270" cy="70" r="14" fill="#10B981" stroke="#FFFFFF" stroke-width="2"/>
    <!-- Star inside goal -->
    <text x="264" y="74" font-family="sans-serif" font-size="12" fill="#FFFFFF">★</text>
    <text x="250" y="52" font-family="sans-serif" font-size="9" font-weight="bold" fill="#4ADE80">Career Ready</text>
  </g>

  <!-- Title Pill -->
  <g transform="translate(30, 255)">
    <rect width="180" height="34" rx="8" fill="#451A03" stroke="#D97706" stroke-width="1.5"/>
    <text x="16" y="22" font-family="system-ui, sans-serif" font-weight="700" font-size="12" fill="#FDE68A">CAREER &amp; SKILLS</text>
  </g>
</svg>