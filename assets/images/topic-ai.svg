<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="500" height="320">
  <defs>
    <linearGradient id="aiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312E81"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="aiSphere" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="aiCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>
  <rect width="500" height="320" rx="16" fill="url(#aiBg)"/>
  
  <!-- Grid Matrix Overlay -->
  <g opacity="0.15" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="80" x2="500" y2="80"/>
    <line x1="0" y1="160" x2="500" y2="160"/>
    <line x1="0" y1="240" x2="500" y2="240"/>
    <line x1="125" y1="0" x2="125" y2="320"/>
    <line x1="250" y1="0" x2="250" y2="320"/>
    <line x1="375" y1="0" x2="375" y2="320"/>
  </g>

  <!-- Neural Network Cluster -->
  <g transform="translate(100, 40)">
    <!-- Synapse connecting lines -->
    <path d="M50 120 L150 60 L250 100 L150 180 Z" stroke="#6366F1" stroke-width="2" fill="none" opacity="0.6"/>
    <path d="M150 60 L250 180" stroke="#38BDF8" stroke-width="2" stroke-dasharray="4 4" fill="none"/>
    <path d="M50 120 L250 100" stroke="#818CF8" stroke-width="1.5" fill="none" opacity="0.4"/>
    
    <!-- Central Brain AI Core -->
    <circle cx="150" cy="120" r="45" fill="url(#aiSphere)" opacity="0.9"/>
    <circle cx="150" cy="120" r="55" fill="none" stroke="#A5B4FC" stroke-width="2" stroke-dasharray="6 6"/>
    
    <!-- Brain Circuit Glyph -->
    <path d="M135 110 Q145 100 155 110 Q165 120 155 130 Q145 140 135 130" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <path d="M142 110 H158 M142 130 H158" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>

    <!-- Peripheral Nodes -->
    <circle cx="50" cy="120" r="16" fill="url(#aiCyan)"/>
    <circle cx="150" cy="60" r="14" fill="#6366F1"/>
    <circle cx="250" cy="100" r="18" fill="url(#aiCyan)"/>
    <circle cx="150" cy="180" r="15" fill="#818CF8"/>
    <circle cx="250" cy="180" r="12" fill="#4ADE80"/>

    <!-- Data Pulse Dots -->
    <circle cx="100" cy="90" r="4" fill="#38BDF8"/>
    <circle cx="200" cy="80" r="4" fill="#F472B6"/>
    <circle cx="200" cy="150" r="4" fill="#34D399"/>
  </g>

  <!-- Title Pill -->
  <g transform="translate(30, 255)">
    <rect width="180" height="34" rx="8" fill="#1E1B4B" stroke="#4338CA" stroke-width="1.5"/>
    <text x="16" y="22" font-family="system-ui, sans-serif" font-weight="700" font-size="12" fill="#E0E7FF">ARTIFICIAL INTELLIGENCE</text>
  </g>
</svg>